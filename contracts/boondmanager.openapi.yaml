      properties:
        reference:
          type: integer
          title: Reference
        taxRate:
          anyOf:
          - type: number
          - type: 'null'
          title: Taxrate
        name:
          type: string
          title: Name
      additionalProperties: true
      type: object
      required:
      - reference
      - name
      title: TypeFrais
