  /api/resources/{item_id}/advantages:
    get:
      summary: Avantages versés — where variable pay actually lives
      description: "`GET /resources/{id}/advantages` — OBSERVED live 2026-09-10.\n\
        \nThe « Avantages versés » tab: one row per payment, dated, with its type,\n\
        quantity and cost. Probed on a production tenant: 200 OK, `meta.totals.rows`\n\
        = 54 on one resource, history running 2020 → 2026, carrying « Prime sur\n\
        lettre d'Objectifs », « Prime exceptionnelle » and « Prime de vacances ».\n\
        \nFour measured properties this route reproduces, because each one changes\n\
        what a consumer must do:\n\n* **no `updateDate`** — no cursor exists, so no\
        \ incremental path. Serving\n  one would invite an extraction that fetches\
        \ nothing in production.\n* **no bulk collection** — `/advantages` answers\
        \ 403 (WAF),\n  `/resources-advantages` and `/contracts-advantages` 404. One\
        \ call per\n  resource, and that cost is structural.\n* **sparse** — six of\
        \ eight resources probed had none at all. An empty\n  `data` with `totals.rows:\
        \ 0` is the NORMAL answer here.\n* **`contract` relationship** — a payment\
        \ belongs to the contract in force\n  on its date, not to the current one.\
        \ One person had eight successive\n  contracts and 54 payments spread across\
        \ them."
      operationId: advantages_api_resources__item_id__advantages_get
