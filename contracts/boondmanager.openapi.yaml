    TypeAvantageContrat:
      properties:
        reference:
          anyOf:
          - type: integer
          - type: 'null'
          title: Reference
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        frequency:
          anyOf:
          - type: string
          - type: 'null'
          title: Frequency
          description: daily | monthly | semiAnnual | annual
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
          description: variableSalaryBasis | package | fixedAmount
        participationQuota:
          anyOf:
          - type: number
          - type: 'null'
          title: Participationquota
        employeeQuota:
          anyOf:
          - type: number
          - type: 'null'
          title: Employeequota
        agencyQuota:
          anyOf:
          - type: number
          - type: 'null'
          title: Agencyquota
      additionalProperties: true
      type: object
      title: TypeAvantageContrat
      description: "A contractual benefit entitlement — shape OBSERVED 2026-09-10.\n\
        \nFilled on 16 of 18 probed contracts, 55 lines. The mock used to serve\n\
        `advantageTypes` as an always-empty array, so this shape had never been\n\
        seen: it is NOT the `DetailFraisContrat` shape it was assumed to share.\n\n\
        Three traps a consumer must know, all measured:\n\n* `reference` is NOT a\
        \ global code. The same `21` is « Health Insurance »\n  on one contract and\
        \ « Variable » on another; `5` is « Life Insurance »\n  here and « Lunch allowance\
        \ » there. It is agency configuration.\n* `category` does NOT say what is\
        \ vested. « Variable » is `fixedAmount`\n  while « Prime de vacances » is\
        \ `variableSalaryBasis`; it describes how\n  the amount is expressed, not\
        \ whether it is owed.\n* none of the three quotas is « the amount ». Depending\
        \ on the line only\n  the employee one is set, or employee + agency, or participation\
        \ +\n  employee. The amount actually PAID lives on `/resources/{id}/advantages`."
