        * **`subsidiaries`** is a LIST of `{id, type: \"company\"}`, empty when the\n\
        \  company has none. Both directions are CONSISTENT: one group listed 16\n\
        \  subsidiaries, each pointing back to it. The mock derives `subsidiaries`\n\
        \  from `parentCompany` so the property holds by construction.\n* **27 attributes**;\
