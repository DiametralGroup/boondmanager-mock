components:
  schemas:
    Absence:
      properties:
        id:
          type: string
          title: Id
        type:
          type: string
          title: Type
          default: absence
        attributes:
          $ref: '#/components/schemas/AbsenceAttributes'
      additionalProperties: true
      type: object
      required:
      - id
      - attributes
      title: Absence
    AbsenceAttributes:
      properties:
        isDeleted:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Isdeleted
          x-boond-confidence: unverified
          x-boond-note: LOGICAL deletion — mock affordance, NEVER emitted by the vendor
            (probed across all eighteen collections, 2026-08-12). Absent from every
            default payload; only /__admin/delete sets it. A consumer MUST treat its
            absence as « not deleted » — reading `not is_deleted` on a NULL column
            yields NULL, hence an empty result set with no error at all.
        startDate:
          anyOf:
          - type: string
          - type: 'null'
          title: Startdate
        endDate:
          anyOf:
          - type: string
          - type: 'null'
          title: Enddate
        duration:
          anyOf:
          - type: number
          - type: 'null'
          title: Duration
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        workUnitType:
          anyOf:
          - $ref: '#/components/schemas/WorkUnit'
          - type: 'null'
        absencesReport:
          anyOf:
          - $ref: '#/components/schemas/AbsencesReport'
          - type: 'null'
      additionalProperties: true
      type: object
      title: AbsenceAttributes
      description: 'An absence''s whole context is EMBEDDED here — no relationships;

        that is the real /absences dialect.'
