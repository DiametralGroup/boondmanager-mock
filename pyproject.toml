[project]
name = "boondmanager-mock"
version = "0.10.0"
description = "BoondManager API mock — container image and installable Python package"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Volontairement minimales : le mock d'origine était tiré par l'image du backend
# d'ophelie (SQLAlchemy, psycopg2, authzed, elasticsearch, boto3, mcp…) alors
# qu'il n'a jamais eu besoin que de FastAPI et d'uvicorn. L'image dédiée est un
# gain immédiat de taille et de surface d'attaque.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
boondmanager-mock = "boondmanager_mock.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boondmanager_mock"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "ARG"]
ignore = [
    "PLR0913",
    "PLR2004",
    # Les imports différés sont DÉLIBÉRÉS et structurants ici :
    #  • state.py charge le module de profil à la demande — un import au niveau
    #    module créerait un cycle state ↔ dataset ↔ settings ;
    #  • app.py n'importe le routeur admin QUE s'il est activé : c'est ce qui
    #    fait que la surface est absente et pas seulement fermée ;
    #  • les tests importent après avoir réglé l'environnement, puisque la
    #    configuration est lue à l'import.
    "PLC0415",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
# The test modules import `tests.conftest`: the repo root must be on sys.path
# regardless of how pytest is launched (`uv run pytest` does not add the CWD).
pythonpath = ["."]
