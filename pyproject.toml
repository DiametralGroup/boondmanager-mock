[project]
name = "boondmanager-mock"
version = "0.11.0"
description = "BoondManager API mock — container image and installable Python package"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"

# Deliberately minimal: the original mock was dragged along by ophelie's
# backend image (SQLAlchemy, psycopg2, authzed, elasticsearch, boto3, mcp…)
# when it only ever needed FastAPI and uvicorn. A dedicated image is an
# immediate win on both size and attack surface.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
boondmanager-mock = "boondmanager_mock.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boondmanager_mock"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "ARG"]
ignore = [
    "PLR0913",
    "PLR2004",
    # Deferred imports are DELIBERATE and structural here:
    #  • state.py loads the dataset profile module on demand — a module-level
    #    import would create a state ↔ dataset ↔ settings cycle;
    #  • app.py only imports the admin router IF it is enabled: that is what
    #    makes the surface absent and not merely closed;
    #  • tests import after setting up the environment, since configuration
    #    is read at import time.
    "PLC0415",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
# The test modules import `tests.conftest`: the repo root must be on sys.path
# regardless of how pytest is launched (`uv run pytest` does not add the CWD).
pythonpath = ["."]
